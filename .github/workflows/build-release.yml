name: Validate OpenNV Godot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: opennv-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-runtime:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download pinned Godot Mono
        id: godot
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $root = Join-Path $env:RUNNER_TEMP 'godot-mono'
          $expectedSha256 = 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$version/Godot_v4.7.2-stable_mono_win64.zip" -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Godot archive hash mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $godot = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*console.exe')
          if ($godot.Count -ne 1) { throw "Expected one Godot console executable; found $($godot.Count)." }
          "path=$($godot[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate clean Godot runtime
        shell: pwsh
        run: ./scripts/Test-GodotRuntime.ps1 -Godot '${{ steps.godot.outputs.path }}'

  desktop-launcher:
    name: Validate desktop launcher (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
          - label: macos-arm64
            os: macos-14
          - label: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix desktop
      - run: npm run check --prefix desktop
      - run: npm test --prefix desktop

# Runtime publishing intentionally remains disabled until a Godot export passes
# campaign, natural-route, persistence, packaging, and retail differential gates.
