name: Validate OpenNV Godot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/godot-runtime

permissions:
  contents: read

concurrency:
  group: opennv-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-runtime:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: content/requirements.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install direct-content dependencies
        run: python -m pip install -r content/requirements.txt

      - name: Download pinned Godot Mono
        id: godot
        shell: pwsh
        run: |
          $version = '4.7.1-stable'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $root = Join-Path $env:RUNNER_TEMP 'godot-mono'
          $expectedSha256 = '764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$version/Godot_v4.7.1-stable_mono_win64.zip" -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Godot archive hash mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $godot = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*console.exe')
          if ($godot.Count -ne 1) { throw "Expected one Godot console executable; found $($godot.Count)." }
          "path=$($godot[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate clean Godot runtime
        shell: pwsh
        run: ./scripts/Test-GodotRuntime.ps1 -Godot '${{ steps.godot.outputs.path }}'

      - name: Cache pinned Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.7.1.stable.mono
          key: godot-mono-4.7.1-windows-export-ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63

      - name: Install pinned Windows export template
        shell: pwsh
        run: |
          $target = Join-Path $env:APPDATA 'Godot/export_templates/4.7.1.stable.mono'
          $windowsTemplate = Join-Path $target 'windows_release_x86_64.exe'
          if (Test-Path -LiteralPath $windowsTemplate -PathType Leaf) { exit 0 }
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono-templates.tpz'
          $expanded = Join-Path $env:RUNNER_TEMP 'godot-mono-templates'
          $expectedSha256 = 'ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz' -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Godot template archive hash mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $source = Join-Path $expanded 'templates'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw 'Godot template archive has no templates directory.' }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force

      - name: Build experimental Windows runtime
        shell: pwsh
        run: |
          $version = 'experimental-' + '${{ github.sha }}'.Substring(0, 12)
          ./scripts/Build-GodotRuntime.ps1 -Godot '${{ steps.godot.outputs.path }}' -OutputRoot "$env:RUNNER_TEMP/opennv" -Version $version -SkipTests

      - name: Upload experimental Godot runtime
        uses: actions/upload-artifact@v4
        with:
          name: opennv-godot-experimental-windows-x64
          path: ${{ runner.temp }}/opennv/*.zip
          if-no-files-found: error

  desktop-launcher:
    name: Validate desktop launcher (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
          - label: macos-arm64
            os: macos-14
          - label: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run check --prefix desktop
      - run: npm test --prefix desktop

# Runtime publishing intentionally remains disabled until a Godot export passes
# campaign, natural-route, persistence, packaging, and retail differential gates.
