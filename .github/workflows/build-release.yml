name: Validate OpenNV Godot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: opennv-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-runtime:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download pinned Godot Mono
        id: godot
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'godot-mono'
          $godot = ./scripts/Install-GodotToolchain.ps1 -Destination $root
          "path=$godot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate clean Godot runtime
        shell: pwsh
        run: ./scripts/Test-GodotRuntime.ps1 -Godot '${{ steps.godot.outputs.path }}'

  desktop-launcher:
    name: Validate desktop launcher (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
          - label: macos-arm64
            os: macos-15
          - label: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix desktop
      - run: npm run check --prefix desktop
      - run: npm test --prefix desktop

# Runtime publishing intentionally remains disabled until a Godot export passes
# campaign, natural-route, persistence, packaging, and retail differential gates.
