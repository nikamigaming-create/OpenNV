<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Nevada — ONV logo studies</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #03090f; color: #edf9fc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 42px; background: radial-gradient(circle at 80% 0, #103247, transparent 31%), #03090f; }
      header { display: flex; justify-content: space-between; align-items: end; max-width: 1300px; margin: 0 auto 30px; padding-bottom: 19px; border-bottom: 1px solid #1f5668; }
      p { margin: 0; color: #9ec5d2; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; } h1 { margin: 7px 0 0; font-size: 46px; letter-spacing: -.055em; } h1 em { color: #5ce7ff; font-style: normal; }
      .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 13px; max-width: 1300px; margin: auto; }.card { padding: 12px; border: 1px solid #225367; background: #06131c; }.card img { width: 100%; display: block; }.card h2 { margin: 13px 3px 3px; font-size: 15px; }.card p { margin: 0 3px 5px; color: #799eab; font-size: 9px; letter-spacing: .09em; }.card:has(img[src="03-compass-onv.svg"]) { border-color: #f2b766; box-shadow: 0 0 0 1px #f2b766, 0 18px 36px rgb(0 0 0 / 35%); }.card:has(img[src="03-compass-onv.svg"]) h2::after { content: "SELECTED"; display: inline-block; margin-left: 8px; color: #f2b766; font-size: 9px; letter-spacing: .12em; vertical-align: middle; }
      @media (max-width: 900px) { body { padding: 22px; }.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <header><div><p>Open Nevada / identity study</p><h1><em>ONV</em> — five routes</h1></div><p>Choose a direction, then I will refine only that one.</p></header>
    <main class="grid">
      <article class="card"><img src="01-contour-onv.svg" alt="Contour ONV logo"><h2>01 — Contour</h2><p>Atmospheric / cinematic</p></article>
      <article class="card"><img src="02-mesa-onv.svg" alt="Mesa ONV logo"><h2>02 — Mesa</h2><p>Geometric / territorial</p></article>
      <article class="card"><img src="03-compass-onv.svg" alt="Compass ONV logo"><h2>03 — Compass</h2><p>Badge / navigational</p></article>
      <article class="card"><img src="04-route-onv.svg" alt="Route ONV logo"><h2>04 — Route</h2><p>Continuous / technical</p></article>
      <article class="card"><img src="05-stencil-onv.svg" alt="Stencil ONV logo"><h2>05 — Stencil</h2><p>Hard / iconic</p></article>
    </main>
  </body>
</html>
