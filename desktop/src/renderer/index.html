<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none';">
    <title>Open Nevada</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand" aria-label="Open Nevada">
          <img class="brand-mark" src="../../assets/open-nevada-onv-mark.svg" alt="">
          <span class="brand-name">OPEN <em>NEVADA</em></span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-type">Launcher</span>
        </div>
        <div class="topbar-actions">
          <span id="runtime-status" class="runtime-status">Checking local runtime</span>
          <button id="choose-runtime" class="quiet-button" type="button">Runtime</button>
        </div>
      </header>

      <section class="route-console" aria-labelledby="selector-title">
        <h1 id="selector-title">Game</h1>
        <div id="campaigns" class="campaign-grid">
          <button class="campaign-card route-fallout1 selected" type="button"><strong class="card-title">Fallout 1</strong><span class="card-detail">FPS · HEX · VR</span></button>
          <button class="campaign-card route-fallout2" type="button"><strong class="card-title">Fallout 2</strong><span class="card-detail">FPS · HEX · VR</span></button>
          <button class="campaign-card route-newvegas" type="button"><strong class="card-title">New Vegas</strong><span class="card-detail">FPS · HEX · VR</span></button>
          <button class="campaign-card route-fallout3" type="button"><strong class="card-title">Fallout 3</strong><span class="card-detail">FPS · HEX · VR</span></button>
        </div>
      </section>

      <section class="launch-deck" aria-label="Launch controls">
        <div class="selection-copy">
          <h2 id="selection-title">Fallout 1</h2>
          <p id="selection-detail" class="selection-detail"></p>
        </div>
        <div class="launch-options">
          <label id="edition-row" class="presentation-select hidden">
            <span>Edition</span>
            <select id="edition"></select>
          </label>
          <div id="presentation-row" class="presentation-select">
            <span>Mode</span>
            <div id="presentation" class="mode-picker" role="group" aria-label="Presentation mode"></div>
          </div>
          <button id="choose-fo1-profile" class="quiet-button hidden" type="button">Set up Fallout 1</button>
          <button id="choose-fo2-profile" class="quiet-button hidden" type="button">Set up Fallout 2</button>
          <button id="choose-ttw-profile" class="quiet-button hidden" type="button">Set up TTW</button>
          <button id="choose-jam-profile" class="quiet-button hidden" type="button">Set up JAM</button>
          <label id="jam-toggle-row" class="jam-toggle">
            <input id="jam-toggle" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            <span id="jam-label">JAM</span>
          </label>
        </div>
        <button id="launch" class="launch-button" type="button">Play</button>
      </section>

      <details id="mod-support" class="advanced">
        <summary>Mods and compatibility</summary>
        <div class="advanced-content">
          <div id="extender-layers" class="layer-list"></div>
          <div id="mods" class="module-list"></div>
          <button id="open-mod-docs" class="quiet-button" type="button">Open mod guide</button>
        </div>
      </details>

      <footer class="footer">
        <span>Use legally owned game files</span>
        <span id="platform-label"></span>
      </footer>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
